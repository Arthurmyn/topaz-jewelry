# Local development stack. `docker compose up` starts everything: site at http://localhost:8080
name: topaz

x-api-env: &api-env
  ENV: local
  DATABASE_URL: postgresql+asyncpg://topaz:topaz@db:5432/topaz
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  SITE_URL: ${SITE_URL:-http://localhost:8080}
  FEATURE_ACCOUNTS: ${FEATURE_ACCOUNTS:-false}
  FEATURE_PAYMENTS: ${FEATURE_PAYMENTS:-false}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
  WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-77000000000}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-topaz-media}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topaz
      POSTGRES_PASSWORD: topaz
      POSTGRES_DB: topaz
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topaz -d topaz"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-topaz-media} &&
      mc anonymous set download local/${S3_BUCKET:-topaz-media}"
    restart: "no"

  api:
    build: { context: ./apps/api, target: dev }
    environment:
      <<: *api-env
      TEST_DATABASE_URL: postgresql+asyncpg://topaz:topaz@db:5432/topaz_test
    volumes:
      - ./apps/api:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed:
    build: { context: ./apps/api, target: dev }
    command: python -m app.cli seed
    environment: *api-env
    volumes:
      - ./apps/api:/app
    depends_on:
      api: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ./apps/web, target: dev }
    environment:
      INTERNAL_API_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      S3_BUCKET: ${S3_BUCKET:-topaz-media}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

volumes:
  pgdata:
  miniodata:
  caddy_data:
  web_node_modules:
  web_next:
